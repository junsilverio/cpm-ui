<p><div class="card alerts">
  <div class="card-header">
    <h3><i class="fas fa-exclamation-circle"></i> Alerts & Notifications</h3>
  </div>
  <div class="card-body">
    <div class="alerts-list">
      <div class="alert-item" *ngFor="let alert of alerts" [class]="alert.type">
        <div class="alert-icon">
          <i class="fas fa-exclamation-circle"></i>
        </div>
        <div class="alert-content">
          <div class="alert-title">{{ alert.title }}</div>
          <div class="alert-subtitle">{{ alert.subtitle }}</div>
        </div>
        <div class="alert-badge">{{ alert.badge }}</div>
      </div>
    </div>
  </div>
</div></p>
