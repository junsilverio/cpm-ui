<p><div class="card weather-widget">
  <div class="card-header">
    <h3><i class="fas fa-cloud-sun"></i> Weather & Site Conditions</h3>
  </div>
  <div class="card-body">
    <div class="weather-grid">
      <div class="weather-day" *ngFor="let day of weatherDays">
        <div class="weather-day-name">{{ day.day }}</div>
        <div class="weather-icon">
          <i class="fas fa-{{ day.icon }}"></i>
        </div>
        <div class="weather-temp">{{ day.temp }}</div>
        <div class="weather-condition">{{ day.condition }}</div>
      </div>
    </div>
  </div>
</div>
