<p><div class="card documents">
  <div class="card-header">
    <h3><i class="fas fa-folder-open"></i> Documents Overview</h3>
    <div class="total-badge">{{ totalDocuments | number }} Total</div>
  </div>
  <div class="card-body">
    <div class="documents-grid">
      <div class="document-item" *ngFor="let doc of documents">
        <div class="document-icon">
          <i class="fas fa-{{ getIconForType(doc.type) }}"></i>
        </div>
        <div class="document-info">
          <div class="document-type">{{ doc.type | titlecase }}</div>
          <div class="document-count">{{ doc.count | number }}</div>
        </div>
      </div>
    </div>
  </div>
</div>
