<p><div class="metric-card" [class.updating]="isUpdating">
  <div class="metric-icon" [style.background]="color">
    <i class="fas fa-{{ icon }}"></i>
  </div>
  <div class="metric-content">
    <div class="metric-title">{{ title }}</div>
    <h2 class="metric-value">{{ value }}</h2>
    <div class="metric-change" *ngIf="change" [class.positive]="changeType === 'positive'" [class.negative]="changeType === 'negative'">
      <i class="fas" [class.fa-arrow-up]="changeType === 'positive'" [class.fa-arrow-down]="changeType === 'negative'" [class.fa-minus]="changeType === 'neutral'"></i>
      {{ change }}
    </div>
  </div>
</div>
