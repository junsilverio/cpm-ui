<p><div class="card integrations">
  <div class="card-header">
    <h3><i class="fas fa-plug"></i> Integrations</h3>
  </div>
  <div class="card-body">
    <div class="integrations-grid">
      <div class="integration-item" *ngFor="let integration of integrations" [class.connected]="integration.connected">
        <i class="fas fa-{{ integration.icon }}"></i>
        <span>{{ integration.name }}</span>
        <div class="connection-status" [class.connected]="integration.connected">
          <i class="fas" [class.fa-check-circle]="integration.connected" [class.fa-times-circle]="!integration.connected"></i>
        </div>
      </div>
    </div>
  </div>
</div>
