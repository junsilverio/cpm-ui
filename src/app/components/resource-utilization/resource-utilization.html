<p><div class="card resource-utilization">
  <div class="card-header">
    <h3><i class="fas fa-chart-pie"></i> Resource Utilization</h3>
  </div>
  <div class="card-body">
    <div class="resources-grid">
      <div class="resource-item" *ngFor="let resource of resources">
        <div class="resource-circle">
          <svg viewBox="0 0 36 36" class="circular-chart">
            <path class="circle-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"/>
            <path class="circle" 
                  [attr.stroke]="resource.color"
                  [style.stroke-dasharray]="resource.utilization + ', 100'" 
                  d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"/>
            <text x="18" y="20.35" class="percentage">{{ resource.utilization }}%</text>
          </svg>
        </div>
        <div class="resource-name">{{ resource.name }}</div>
      </div>
    </div>
  </div>
</div></p>
