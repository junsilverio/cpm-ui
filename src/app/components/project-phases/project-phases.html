<p><div class="card project-phases">
  <div class="card-header">
    <h3><i class="fas fa-layer-group"></i> Project Phases</h3>
  </div>
  <div class="card-body">
    <div class="phases-flow">
      <div class="phase-item" *ngFor="let phase of phases; let i = index">
        <div class="phase-circle" [style.background]="phase.color">
          {{ phase.count }}
        </div>
        <div class="phase-name">{{ phase.name }}</div>
        <div class="phase-arrow" *ngIf="i < phases.length - 1">
          <i class="fas fa-arrow-right"></i>
        </div>
      </div>
    </div>
  </div>
</div>
